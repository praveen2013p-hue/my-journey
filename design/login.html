<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Journey — Login</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600&display=swap"><style>
body{margin:0;background:#16171A;color:#E8E6E1;font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.45}
*{box-sizing:border-box}
a{color:#E3C173;text-decoration:none}a:hover{color:#F1D898}
.serif{font-family:'Cormorant Garamond',Georgia,serif}
.num{font-variant-numeric:tabular-nums}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #C9A24A;outline-offset:2px}
.app{display:flex;flex-wrap:wrap;min-height:900px;background:#16171A}
.sb{flex:0 0 232px;background:#121316;border-right:1px solid #2E3138;padding:22px 14px;display:flex;flex-direction:column;gap:20px}
.sb.col{flex-basis:68px;padding:22px 10px;align-items:center}
.logo{font-family:'Cormorant Garamond',Georgia,serif;font-size:28px;font-weight:600;color:#C9A24A;padding:0 8px}
.reg{background:#1A1C20;border:1px solid #2E3138;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:12px;color:#A3A39E}
.reg div{display:flex;align-items:center;gap:8px;justify-content:space-between}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%}
.d-g{background:#3DBE7A}.d-a{background:#E8923A}.d-r{background:#F06A62}
.nav{display:flex;flex-direction:column;gap:4px;flex:1}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:8px;color:#A3A39E;font-weight:500;min-height:44px}
.nav a:hover{background:#1B1D21;color:#E8E6E1}
.nav a.on{background:rgba(201,162,74,.14);color:#E3C173}
.sb.col .nav a{padding:11px;justify-content:center}
.me{display:flex;align-items:center;gap:10px;color:#A3A39E;font-size:13px;padding:0 6px}
.av{width:32px;height:32px;border-radius:50%;background:#2A2D33;color:#E3C173;display:inline-flex;align-items:center;justify-content:center;font-weight:600}
.main{flex:999 1 560px;min-width:0;padding:28px 32px 40px;display:flex;flex-direction:column;gap:20px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.h1{font-size:26px;font-weight:650;margin:0;letter-spacing:-.2px}
.sub{color:#A3A39E;font-size:13px}
.card{background:#1E2024;border:1px solid #2E3138;border-radius:12px;padding:18px}
.card h2{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:#A3A39E;margin:0 0 14px;font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid;white-space:nowrap}
.c-g{color:#3DBE7A;border-color:#2F7F57;background:rgba(61,190,122,.12)}
.c-a{color:#E8923A;border-color:#8A5522;background:rgba(232,146,58,.12)}
.c-r{color:#F06A62;border-color:#8A3A36;background:rgba(240,106,98,.12)}
.c-y{color:#E6CF5C;border-color:#7A6E2A;background:rgba(230,207,92,.10)}
.c-gold{color:#E3C173;border-color:#7A6531;background:rgba(201,162,74,.12)}
.c-n{color:#A3A39E;border-color:#3A3E46;background:#24262B}
.btn{border:1px solid #3A3E46;background:#24262B;color:#E8E6E1;border-radius:8px;padding:8px 14px;font:inherit;font-weight:500;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:#2C2F36}
.btn.pri{background:#C9A24A;color:#16171A;border-color:#C9A24A;font-weight:650}
.btn.pri:hover{background:#D8B45C}
.btn.sm{min-height:40px;padding:6px 12px}
.pill{border:1px solid #3A3E46;background:transparent;color:#A3A39E;border-radius:999px;padding:6px 14px;font:inherit;font-weight:500;min-height:40px;cursor:pointer}
.pill.on{background:rgba(201,162,74,.16);border-color:#7A6531;color:#E3C173}
.field{background:#16171A;border:1px solid #3A3E46;color:#E8E6E1;border-radius:8px;padding:8px 12px;font:inherit;min-height:44px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.banner{border-radius:10px;padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;font-weight:500}
.b-red{background:rgba(240,106,98,.12);border:1px solid #8A3A36;color:#F4A39E}
.b-gold{background:rgba(201,162,74,.12);border:1px solid #7A6531;color:#E3C173}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12px;color:#A3A39E;font-weight:600;padding:10px 12px;border-bottom:1px solid #2E3138;white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid #272A30;white-space:nowrap}
.tbl .r{text-align:right}
.tbl tr.sel td{background:rgba(201,162,74,.10)}
.scroll{overflow-x:auto}
.pos{color:#3DBE7A}.neg{color:#F06A62}.warn{color:#E8923A}.mut{color:#A3A39E}.gold{color:#E3C173}
.big{font-size:30px;font-weight:650;letter-spacing:-.5px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.kv div span{display:block;font-size:12px;color:#A3A39E}
.kv div b{font-weight:600;font-size:15px}
.tabs{display:flex;gap:6px;border-bottom:1px solid #2E3138}
.tabs a{padding:10px 16px;color:#A3A39E;font-weight:600;border-bottom:2px solid transparent;min-height:44px;display:inline-flex;align-items:center}
.tabs a.on{color:#E3C173;border-bottom-color:#C9A24A}
.panel{flex:0 0 430px;background:#1A1C20;border-left:1px solid #2E3138;padding:24px;display:flex;flex-direction:column;gap:20px}
.sec{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:#A3A39E;font-weight:600;margin:0 0 10px}
.stat{display:flex;gap:6px 22px;flex-wrap:wrap;align-items:center;padding:8px 14px;background:#1A1C20;border:1px solid #2E3138;border-radius:10px;font-size:12px;color:#A3A39E}.stat b{color:#E8E6E1;font-weight:600}
.tvl{display:inline-flex;align-items:center;gap:5px;font-weight:650;color:#E3C173}.tvl:hover{color:#F1D898;text-decoration:underline}
.note{width:100%;min-height:76px;resize:none;background:#16171A;border:1px solid #3A3E46;border-radius:8px;color:#E8E6E1;font:inherit;padding:10px 12px}

.lg{position:relative;width:100%;height:900px;background:#16171A;overflow:hidden}
.lg .q{position:absolute;left:120px;top:210px;max-width:760px}
.lg .mark{position:absolute;left:96px;top:60px;font-family:'Cormorant Garamond',Georgia,serif;font-size:300px;line-height:1;color:#1F2126;user-select:none}
.lg blockquote{margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-size:64px;line-height:1.12;color:#ECE7DA;font-weight:500;position:relative}
.lg cite{display:block;margin-top:28px;font-style:normal;color:#C9A24A;letter-spacing:.14em;text-transform:uppercase;font-size:13px;font-weight:600}
.lg .rule{width:64px;height:2px;background:#C9A24A;margin-top:36px}
.lg .dots{display:flex;gap:8px;margin-top:22px}.lg .dots i{width:7px;height:7px;border-radius:50%;background:#3A3E46;display:block}.lg .dots i.on{background:#C9A24A}
.lg .brand{position:absolute;left:120px;top:56px;font-family:'Cormorant Garamond',Georgia,serif;color:#C9A24A;font-size:28px;font-weight:600}
.lg .card2{position:absolute;right:48px;bottom:48px;width:380px;background:#1E2024;border:1px solid #2E3138;border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:16px}
.lg .gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:48px;border-radius:10px;border:1px solid #C9A24A;background:#C9A24A;color:#16171A;font:inherit;font-weight:650;cursor:pointer}
.lg .gbtn:hover{background:#D8B45C}
</style></head><body><div class="lg">
<div class="brand">My Journey</div>
<div class="mark" aria-hidden="true">“</div>
<figure class="q" style="margin:0;left:120px;top:210px;position:absolute">
<blockquote>What blocks your path becomes your path.</blockquote>
<div class="rule"></div>
<cite>Marcus Aurelius · paraphrased</cite>
<div class="dots" aria-hidden="true"><i class="on"></i><i></i><i></i><i></i><i></i></div>
</figure>
<section class="card2" aria-label="Sign in">
<div><div class="serif" style="font-size:34px;font-weight:600;color:#E3C173;line-height:1.1">My Journey</div>
<div class="sub" style="margin-top:6px">Patience. Process. Compounding.</div></div>
<button class="gbtn" type="button">Continue with Google</button>
<div class="sub" style="font-size:12px">Private workspace. Only two approved Google accounts can enter.</div>
</section>
</div></body></html>
